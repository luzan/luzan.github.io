<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post" action="/" id="id">
        Name => <input id="inputText" name="text-input" type="text" />
        <br>
        <br>
        Description => <textarea id="inputTextArea" name="text-area" type="text" row="20" col="4"></textarea>
        <br>
        <br>
        Gender =>  <div style="display: inline-block" id="radioGroup">
            <input type="radio" name="radio-group" checked="checked" value="Male">Male</input> 
            <input type="radio" name="radio-group" value="Female">Female</input> 
            <input type="radio" name="radio-group" value="Other"> Other</input>
        </div>
        <br>
        <br>
        Age Group =>  
        <select id="selectId" name="select">
            <option value="12-18">12-18</option>
            <option value="18-25">18-25</option>
            <option value="25-35">25-35</option>
            <option value="35-45">35-45</option>
        </select>
        <br>
        <br>
        Hobbies =>  <div style="display: inline-block" id="checkboxGroup">
            <input type="checkbox" name="checkbox-group" checked="checked" value="Swimming">Swimming</input> 
            <input type="checkbox" name="checkbox-group" value="Cycling">Cycling</input> 
            <input type="checkbox" name="checkbox-group" value="Hiking">Hiking</input>
        </div>
        <br>
        <br>
        <input type="submit"/>
        <button type="button" id="reload">Clear</button>
    </div>
</body>
</html>

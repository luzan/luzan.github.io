<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<script>
    let objArray = [{ name: "a", age: 70 }, { name: "b", age: 30 }, { name: "c", age: 40 }];

    $(function () {
        let tableElement = document.createElement("table");
        tableElement.id = "tableId";
        document.body.append(tableElement);
        let myTable = buildTable(objArray,  $(tableElement));
        $("#addRow").click(function (e) { 
            e.preventDefault();
            let tableElement =  $('#tableId');
            let name = document.getElementById("rowName").value;
            let age = document.getElementById("rowAge").value;
            objArray.push({name: name, age: age});
            console.log(objArray)
            buildTable(objArray, tableElement);
        });
    })

    function filterArray() {
        let filteredArray = objArray.filter(function (element, index) {
            return element.age < 70;
        })
        let tableElement =  $('#tableId');
        tableElement.html("");
        buildTable(filteredArray, tableElement);
    }

    function sumOfAge() {
        let initial = 0;
        let sum = objArray.reduce((x, y) => x + y.age, initial);
        console.log(sum)
        document.getElementById("data").innerHTML = "Sum of ages = " + sum;
    }

    function buildTable(objArray, tableElement) {
        let rows = "";
        let headers = "<tr>";
        //Create headers
        for (let key in objArray[0]) {
            headers += "<th>" + key + "</th>";
        }
        headers += "</tr>";
        console.log(headers)
        for (let element of objArray) {
            rows += "<tr>";
            for (let key in element) {
                rows += "<td>" + element[key] + "</td>";
            }
            rows += "</tr>"
        }
        console.log(rows)
        tableElement.html(headers + rows);
        return tableElement;
    }
</script>

<body>
    <input type="text" name="rowName" id="rowName" placeholder="Name" />
    <input type="text" name="rowAge" id="rowAge" placeholder="Age"/>
    &nbsp;<input type="button" value="Add row" id="addRow"/><br><br>
    <button onclick="filterArray()">Filter Array</button>
    <button onclick="sumOfAge()">Sum of ages</button>
    <p id="data"></p>

</body>

</html>
